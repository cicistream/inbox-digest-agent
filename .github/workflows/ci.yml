name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm run gate:quality
      - run: node -c src/index.mjs
      - run: node -c src/summarizer.mjs
      - run: node -c src/notion-client.mjs
      - run: node -c src/notifier.mjs
      - run: node -c src/state-db.mjs
      - run: node -c src/actions-cli.mjs
      - run: node -c src/digest-idempotency.mjs
